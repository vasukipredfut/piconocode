# Test-only Spring profile. The real datasource URL / Redis host are injected
# at runtime by EarmsContainersExtension via @DynamicPropertySource, so the
# placeholders below are overridden before context refresh. Keep them anyway
# so accidental "no-containers" runs fail loudly instead of dialling 127.0.0.1.

spring.application.name=aria-test
server.port=0

# Primary datasource — overridden by EarmsContainersExtension.
psql.datasource.url=jdbc:mariadb://localhost:0/earms_test
psql.datasource.username=test
psql.datasource.password=test
psql.datasource.driver-class-name=org.mariadb.jdbc.Driver

# SQL Server: remote WMS host is unreachable in CI / Testcontainers. Hikari's
# initialization-fail-timeout=-1 keeps the pool lazy so the context still loads.
spring.datasource.sqlserver.jdbc-url=jdbc:sqlserver://127.0.0.1:0;databaseName=stub
spring.datasource.sqlserver.username=stub
spring.datasource.sqlserver.password=stub
spring.datasource.sqlserver.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.sqlserver.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none

# Redis — overridden by extension.
spring.cache.type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Auth
jwt.secret=test-secret-do-not-use-in-prod
jwt.ExpirationMs=3600000
jwt.RefreshExpirationMs=7200000

# Mail
mail.smtp.password=stub
spring.mail.host=localhost
spring.mail.port=2525

# Logging — keep tests quiet but surface our own diagnostic lines.
logging.level.root=WARN
logging.level.com.aria=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
