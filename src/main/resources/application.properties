############### REDIS / CACHE (REARCH ADR-007) ##################
# Local dev defaults; overridable via env. Lettuce client, single-node.
# For prod use Sentinel/Cluster and externalize host/port via env.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
earms.cache.ttl.default-seconds=300
earms.cache.ttl.master-seconds=3600

############### M0 — Configurable Pages (Round 1F) ##################
# Auto-bootstrap V3 / V3_2 page-substrate schema on startup. Disable for
# test profiles that own their own schema lifecycle (the page-substrate
# IT controls it via @TestPropertySource).
earms.m0.pages.bootstrap.enabled=true
# Cache TTL for published page bodies served by PageRendererService.
earms.m0.pages.cache.ttl-seconds=3600

############### M11 — Integration Hub (Round 1H.1) ##################
# Envelope-key resolution: env var EARMS_M11_KEK_BASE64 (base64(32 bytes))
# takes precedence; otherwise earms.m11.kek.base64; otherwise the dev
# fallback (a fixed key derived from a constant pepper) when
# earms.m11.kek.devFallback=true. Production MUST set the env var.
earms.m11.kek.base64=
earms.m11.kek.devFallback=true


# --- AI / LLM provider config (local, CPU-bound Ollama by default) ---------
# Ollama endpoint + model. If Ollama isn't running, LlmProxy falls back
# to each agent's deterministic scaffold. Install:
#   curl -fsSL https://ollama.com/install.sh | sh
#   ollama pull qwen2.5:3b-instruct
ai.ollama.default-endpoint=http://localhost:11434
ai.ollama.default-model=qwen2.5:7b-instruct
# Comma-separated allowlist of hostnames whose TLS certs we accept even if
# self-signed. Populate with the HOSTNAME of your GPU host while it still
# runs Caddy's `tls internal` self-signed cert. Remove entries once the
# host has a real (Let's Encrypt) cert. NEVER put a domain here if you
# don't personally control its TLS.
ai.ollama.insecure-tls-hosts=69.197.187.75
