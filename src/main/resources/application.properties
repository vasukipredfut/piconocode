spring.devtools.restart.enabled=true

############### FLYWAY (DORMANT) ##################
# Schema migrations are wired but DISABLED. With enabled=false, Spring Boot's
# FlywayAutoConfiguration backs off entirely and nothing runs at startup.
# V1__baseline.sql is MySQL 8 DDL, so enable this ONLY after the primary
# datasource has been switched from PostgreSQL to MySQL (Workstream 2 cutover).
# To activate: set spring.flyway.enabled=true (ideally via the MySQL profile).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate lets Flyway adopt an existing (already-populated) DB at V1
# instead of trying to recreate it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline

