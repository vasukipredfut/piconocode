# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=30     
spring.datasource.hikari.minimum-idle=5              
spring.datasource.hikari.idle-timeout=30000         
spring.datasource.hikari.max-lifetime=1800000         
spring.datasource.hikari.connection-timeout=30000     
spring.datasource.hikari.validation-timeout=5000     
spring.datasource.hikari.leak-detection-threshold=5000 

spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
# Primary datasource is MariaDB now; PostgreSQLDialect was drift from the
# original PG era. Hibernate 6 also infers from the JDBC driver, but pin
# explicitly for stability.
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MariaDBDialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# springdoc-openapi (replaces Springfox on Spring Boot 3)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Enable Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024


# WARNING: jwt.secret is the HMAC signing key for user JWTs — NOT brand text.
# Changing this value invalidates every issued token (every user + every
# integration gets logged out on next request). Do NOT sweep it during a
# rebrand or theme change. Rotate deliberately only when the secret is
# compromised — and plan a "everyone re-log-in" comms window first.
#
# Length: HS512 needs ≥ 64 bytes of entropy. Value below is 96 hex chars
# (48 bytes cryptographic random from secrets.token_hex(48)). For prod,
# regenerate and set via env var JWT_SECRET (Spring property placeholder
# support), never commit the prod key here.
jwt.secret=${JWT_SECRET:6dd024f1c61dc236b1c4ec70c18a8d0c4a6018bd69ab98a9b862418b4a874592920b63bbea86723f602093457f422ace}
jwt.ExpirationMs= 3600000
jwt.RefreshExpirationMs= 7200000

